<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101426">
<title>Moon Time</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0c1020;--panel:#151b30;--panel2:#1b2340;--line:#293252;--text:#f4f6ff;--muted:#9ba6c5;--accent:#8c7bff;--cyan:#55d8d0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#292253 0,transparent 34%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}.app{max-width:1100px;margin:auto;min-height:100vh;display:grid;grid-template-columns:330px 1fr;background:#0e1426dd;border-inline:1px solid #222b49}.side{border-left:1px solid var(--line);padding:20px 16px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.moon{width:45px;height:45px;border-radius:16px;background:linear-gradient(135deg,#a99cff,#6252d8);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 30px #7968ff55}.brand b{font-size:21px;letter-spacing:.3px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.search{width:100%;border:1px solid var(--line);background:var(--panel);color:white;border-radius:13px;padding:13px 14px;font:inherit;outline:none}.section{font-size:12px;color:var(--muted);margin:22px 5px 10px}.chat{display:flex;align-items:center;gap:11px;padding:12px 9px;border-radius:14px;cursor:pointer}.chat.active,.chat:hover{background:var(--panel2)}.avatar{width:43px;height:43px;flex:none;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#4c6eaa,#7964d8);font-weight:bold}.chat:nth-of-type(4) .avatar{background:linear-gradient(135deg,#167d82,#55b9a8)}.chat:nth-of-type(5) .avatar{background:linear-gradient(135deg,#a35a86,#d58a8a)}.meta{min-width:0;flex:1}.meta b{font-size:14px}.meta p{margin:5px 0 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted)}.main{display:flex;flex-direction:column;min-height:100vh}.top{height:76px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line);gap:12px}.top .avatar{width:42px;height:42px}.top small{display:block;color:var(--cyan);font-size:11px;margin-top:5px}.actions{margin-right:auto;display:flex;gap:8px}.icon{border:1px solid var(--line);background:var(--panel);color:#dce1ff;border-radius:12px;padding:10px 12px;cursor:pointer}.messages{padding:22px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:13px}.welcome{margin:auto;text-align:center;max-width:340px;color:var(--muted);line-height:2}.welcome .big{font-size:52px}.bubble{max-width:75%;padding:12px 15px;border-radius:16px;background:var(--panel2);line-height:1.8;font-size:14px;align-self:flex-start}.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#6557c9,#5145a5);border-bottom-left-radius:5px}.bubble .stamp{display:block;text-align:left;color:#c6c9ed;font-size:10px;margin-top:4px}.composer{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:9px}.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:white;padding:14px;font:inherit;outline:none}.send{background:linear-gradient(135deg,#8c7bff,#5b50c9);color:white;border:0;border-radius:14px;padding:0 20px;font:inherit;cursor:pointer}.notice{font-size:10px;color:#8590b0;text-align:center;padding:0 12px 12px}.mobile-title{display:none}.actions .icon{font-size:11px}.chat:focus{outline:2px solid var(--accent)}
@media(max-width:700px){.app{display:block;border:0}.side{padding:17px 14px;border:0}.side.hidden{display:none}.main{display:none;min-height:100dvh}.main.show{display:flex}.side .brand{margin-bottom:16px}.section{margin-top:15px}.top{height:68px;padding:0 13px}.messages{padding:15px}.composer{padding:11px}.mobile-title{display:block;margin-right:auto}.actions .icon{padding:8px}.back{display:block!important}.side.hidden+.main{display:flex}}
.back{display:none}
.auth{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 20% 10%,#30265e,transparent 42%),#0b1020;display:grid;place-items:center;padding:20px}.auth-card{width:min(420px,100%);background:#151b30;border:1px solid #30385b;border-radius:24px;padding:26px;box-shadow:0 25px 90px #0008}.auth-card h1{margin:8px 0;font-size:25px}.auth-card p{color:var(--muted);font-size:13px;line-height:1.9}.auth-card input{width:100%;margin:7px 0;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0d1427;color:white;font:inherit}.auth-card button,.primary{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#8c7bff,#5b50c9);color:white;font:inherit;margin-top:10px}.auth-error{color:#ff9baf!important;min-height:20px}.side-tools{display:flex;gap:7px;margin-top:14px}.side-tools button{flex:1;padding:10px 5px;font-size:11px}.chat-kind{font-size:9px;color:var(--cyan);margin-right:5px}.side .section{display:flex;justify-content:space-between;align-items:center}
</style></head>
<body>
<div class="auth" id="authGate"><div class="auth-card"><div class="moon">☾</div><h1>Moon Time</h1><p>برای ساخت حساب آنلاین یا ورود، اطلاعاتت را وارد کن.</p><input id="inviteInput" placeholder="کد معرف (فقط ثبت‌نام)" autocomplete="off"><input id="regName" placeholder="نام نمایشی" maxlength="32"><input id="emailInput" type="email" placeholder="ایمیل"><input id="passwordInput" type="password" placeholder="رمز عبور (حداقل ۸ کاراکتر)"><button id="enterBtn">ثبت‌نام آنلاین</button><button id="loginBtn" style="background:#293252">ورود به حساب</button><button id="resendBtn" style="background:#293252">ارسال دوباره ایمیل تأیید</button><p class="auth-error" id="authError"></p></div></div>
<div class="app" id="appRoot"><aside class="side" id="side"><div class="brand"><div class="moon">☾</div><div><b>Moon Time</b><small>ارتباطی فراتر از مرزها</small></div></div><input class="search" id="search" placeholder="جست‌وجوی گفتگوها…"><div class="section">گفتگوها</div><div class="side-tools"><button class="icon" id="newChat">＋ گفتگو</button><button class="icon" id="newGroup">＋ گروه</button><button class="icon" id="newChannel">＋ کانال</button></div><div id="chatList"></div></aside>
<main class="main" id="main"><header class="top"><button class="icon back" id="back">‹</button><div class="avatar" id="currentAvatar">✦</div><div><b id="currentName">یادداشت‌های من</b><small id="chatStatus">آماده اتصال</small></div><div class="mobile-title">Moon Time</div><div class="actions"><button class="icon" id="addMemberBtn" title="افزودن عضو">افزودن عضو</button><button class="icon" id="profileBtn" title="حساب کاربری">حساب</button><button class="icon" id="logoutBtn" title="خروج">خروج</button></div></header><section class="messages" id="messages"><div class="welcome"><div class="big">☾</div><b>به Moon Time خوش آمدی</b><br>برای شروع، یک گفتگوی جدید بساز یا گروهی ایجاد کن.</div></section><form class="composer" id="form"><input id="messageInput" autocomplete="off" placeholder="پیامت را بنویس…"><button class="send">ارسال</button></form><div class="notice" id="netStatus">در حال بررسی اتصال به سرور…</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL="https://krmuwbxjsjrezwnhybxa.supabase.co";
const SUPABASE_KEY="sb_publishable_v-3Kw8OKJszThrMlQ1ojBQ_ixj1BbFk";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const side=$('side'),main=$('main'),messages=$('messages'),input=$('messageInput'),status=$('netStatus');
let user=null,currentId=null,currentKind=null,subscription=null,opening=false;
function showError(message){$('authError').textContent=message}
function setStatus(message){status.textContent=message}
function showWelcome(message){messages.innerHTML='';const box=document.createElement('div');box.className='welcome';box.innerHTML='<div class="big">☾</div><b>به Moon Time خوش آمدی</b><br>';box.append(document.createTextNode(message));messages.appendChild(box)}
async function showApp(){
  if(!user)return;
  $('authGate').style.display='none';$('appRoot').style.display='grid';
  $('currentName').textContent=user.email||'حساب من';
  $('chatStatus').textContent='حساب آنلاین';
  const profile=await sb.from('profiles').upsert({id:user.id,display_name:user.user_metadata?.display_name||user.email?.split('@')[0]||'کاربر',email:user.email},{onConflict:'id'});
  if(profile.error)setStatus('ورود برقرار است؛ خطای پروفایل: '+profile.error.message);
  else setStatus('متصل به سرور Moon Time');
  await loadConversations();
}
async function register(){
 try{
  showError('');
  const code=$('inviteInput').value.trim().toUpperCase(),name=$('regName').value.trim(),email=$('emailInput').value.trim(),password=$('passwordInput').value;
  if(code.length<4)throw Error('کد معرف را وارد کن.');
  if(name.length<2)throw Error('نام نمایشی باید حداقل ۲ نویسه باشد.');
  if(!email)throw Error('ایمیل را وارد کن.');
  if(password.length<8)throw Error('رمز عبور باید حداقل ۸ نویسه باشد.');
  const {data:valid,error:inviteError}=await sb.rpc('check_moon_invite',{p_code:code});
  if(inviteError)throw inviteError;
  if(valid!==true)throw Error('کد معرف معتبر نیست.');
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:"https://krmuwbxjsjrezwnhybxa.supabase.co/functions/v1/moon-time"}});
  if(error)throw error;
  if(!data.session){showError('حساب ساخته شد. ایمیلت را تأیید کن و سپس از بخش ورود وارد شو.');return;}
  user=data.user;await showApp();
 }catch(e){showError(e.message||'ثبت‌نام انجام نشد.');}
}
async function login(){
 try{
  showError('');
  const email=$('emailInput').value.trim(),password=$('passwordInput').value;
  if(!email||!password)throw Error('ایمیل و رمز عبور را وارد کن.');
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error)throw error;
  user=data.user;await showApp();
 }catch(e){showError(e.message||'ورود انجام نشد.');}
}
function clearChats(){$('chatList').innerHTML='';}
async function loadConversations(){
 if(!user)return;
 clearChats();
 const {data:members,error}=await sb.from('conversation_members').select('conversation_id').eq('user_id',user.id);
 if(error){setStatus('خطا در دریافت گفتگوها: '+error.message);showWelcome('دریافت گفتگوها ناموفق بود.');return;}
 const ids=[...new Set((members||[]).map(x=>x.conversation_id))];
 if(!ids.length){currentId=null;currentKind=null;showWelcome('برای شروع، از دکمه‌های سمت راست گفتگو یا گروه بساز.');return;}
 const {data:rooms,error:roomError}=await sb.from('conversations').select('id,title,is_group,kind,created_at').in('id',ids).order('created_at',{ascending:false});
 if(roomError){setStatus('خطا در بارگذاری گفتگوها: '+roomError.message);return;}
 (rooms||[]).forEach(addConversation);
 if(rooms&&rooms.length)await openConversation(rooms[0].id,rooms[0].title||'گفتگو',rooms[0].kind||'group');
 else showWelcome('هنوز گفتگویی وجود ندارد.');
}
function addConversation(room){
 const list=$('chatList');
 if(list.querySelector('[data-id="'+room.id+'"]'))return;
 const el=document.createElement('div');el.className='chat';el.dataset.id=room.id;el.dataset.name=room.title||'گفتگو';el.dataset.kind=room.kind||'group';
 const avatar=room.kind==='channel'?'▣':room.kind==='direct'?'◉':'👥';
 const a=document.createElement('div');a.className='avatar';a.textContent=avatar;
 const meta=document.createElement('div');meta.className='meta';const b=document.createElement('b');b.textContent=el.dataset.name;
 const p=document.createElement('p');p.textContent=room.kind==='channel'?'کانال':room.kind==='direct'?'گفتگوی خصوصی':'گروه';
 meta.append(b,p);el.append(a,meta);el.onclick=()=>openConversation(room.id,el.dataset.name,el.dataset.kind);list.appendChild(el);
}
async function createRoom(kind){
 const title=prompt(kind==='group'?'نام گروه را وارد کن:':'نام کانال را وارد کن:');
 if(!title||!title.trim())return;
 try{
  const {data:room,error}=await sb.from('conversations').insert({title:title.trim().slice(0,60),is_group:true,kind,created_by:user.id}).select().single();
  if(error)throw error;
  addConversation(room);await openConversation(room.id,room.title,kind);
 }catch(e){setStatus('ساخت گفتگو ناموفق بود: '+e.message);}
}
async function createDirect(){
 const email=prompt('ایمیل دقیق کاربری را وارد کن:');
 if(!email||!email.trim())return;
 try{
  const {data:found,error}=await sb.rpc('lookup_profile_by_email',{p_email:email.trim()});
  if(error)throw error;
  const target=Array.isArray(found)?found[0]:found;
  if(!target)throw Error('کاربری با این ایمیل پیدا نشد. ابتدا باید در Moon Time ثبت‌نام کرده باشد.');
  const {data:room,error:roomError}=await sb.from('conversations').insert({title:target.display_name||'گفتگوی خصوصی',is_group:false,kind:'direct',created_by:user.id}).select().single();
  if(roomError)throw roomError;
  const {error:memberError}=await sb.from('conversation_members').insert({conversation_id:room.id,user_id:target.id});
  if(memberError)throw memberError;
  addConversation(room);await openConversation(room.id,room.title,'direct');
 }catch(e){setStatus('شروع گفتگوی خصوصی ناموفق بود: '+e.message);}
}
async function addMember(){
 if(!currentId||!currentKind||currentKind==='direct'){setStatus('ابتدا یک گروه یا کانال را باز کن.');return;}
 const email=prompt('ایمیل عضو جدید را وارد کن:');if(!email||!email.trim())return;
 try{
  const {data:found,error}=await sb.rpc('lookup_profile_by_email',{p_email:email.trim()});
  if(error)throw error;
  const target=Array.isArray(found)?found[0]:found;
  if(!target)throw Error('کاربری با این ایمیل پیدا نشد.');
  const {error:insertError}=await sb.from('conversation_members').insert({conversation_id:currentId,user_id:target.id});
  if(insertError&&insertError.code!=='23505')throw insertError;
  setStatus('عضو به گفتگو اضافه شد.');
 }catch(e){setStatus('افزودن عضو ناموفق بود: '+e.message);}
}
async function openConversation(id,title,kind){
 if(opening)return;opening=true;
 try{
  currentId=id;currentKind=kind; $('currentName').textContent=title;$('currentAvatar').textContent=kind==='channel'?'▣':kind==='direct'?'◉':'👥';
  $('chatStatus').textContent=kind==='channel'?'کانال':kind==='direct'?'گفتگوی خصوصی':'گروه';
  document.querySelectorAll('#chatList .chat').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
  if(subscription){await sb.removeChannel(subscription);subscription=null;}
  const seen=new Set();
  messages.innerHTML='';
  subscription=sb.channel('moon-time-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},payload=>{
   if(payload.new.sender_id!==user.id&&!seen.has(payload.new.id)){seen.add(payload.new.id);appendMessage(payload.new,false);}
  }).subscribe(state=>{if(state==='CHANNEL_ERROR'||state==='TIMED_OUT')setStatus('اتصال زنده قطع شد؛ پیام‌ها با بارگذاری مجدد قابل دریافت‌اند.');});
  await loadMessages(id,seen);
  if(innerWidth<=700){side.classList.add('hidden');main.classList.add('show');}
 }finally{opening=false;}
}
function appendMessage(m,mine){
 const d=document.createElement('div');d.className='bubble'+(mine?' mine':'');d.append(document.createTextNode(m.body));
 const stamp=document.createElement('span');stamp.className='stamp';stamp.textContent=new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});d.appendChild(stamp);messages.appendChild(d);messages.scrollTop=messages.scrollHeight;
}
async function loadMessages(id,seen=new Set()){
 const {data,error}=await sb.from('messages').select('id,body,sender_id,created_at').eq('conversation_id',id).order('created_at',{ascending:true}).limit(200);
 if(error){setStatus('خطا در دریافت پیام‌ها: '+error.message);return;}
 if(!data||!data.length){showWelcome('هنوز پیامی در این گفتگو نیست. اولین پیام را بفرست.');return;}
 data.forEach(m=>{if(!seen.has(m.id)){seen.add(m.id);appendMessage(m,m.sender_id===user.id);}});
}
$('form').addEventListener('submit',async e=>{
 e.preventDefault();const body=input.value.trim();if(!body||!currentId)return;
 if(body.length>5000){setStatus('پیام بیش از ۵۰۰۰ نویسه است.');return;}
 const {data,error}=await sb.from('messages').insert({conversation_id:currentId,sender_id:user.id,body}).select().single();
 if(error){setStatus('ارسال پیام ناموفق بود: '+error.message);return;}
 input.value='';appendMessage(data,true);setStatus('پیام ارسال شد.');
});
$('enterBtn').onclick=register;$('loginBtn').onclick=login;
$('resendBtn').onclick=async()=>{try{showError('');const email=$('emailInput').value.trim();if(!email)throw Error('اول ایمیلت را وارد کن.');const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:SUPABASE_URL+'/functions/v1/moon-time'}});if(error)throw error;showError('درخواست ارسال ایمیل تأیید ثبت شد. صندوق ورودی و هرزنامه را بررسی کن.');}catch(e){showError(e.message||'ارسال ایمیل ناموفق بود.');}};
$('newChat').onclick=createDirect;$('newGroup').onclick=()=>createRoom('group');$('newChannel').onclick=()=>createRoom('channel');
$('addMemberBtn').onclick=addMember;
$('profileBtn').onclick=async()=>{const {data,error}=await sb.from('profiles').select('display_name,email,role').eq('id',user.id).maybeSingle();if(error){setStatus(error.message);return;}alert('نام: '+(data?.display_name||'')+'\nایمیل: '+user.email+'\nنقش: '+(data?.role||'member'));};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();if(subscription)await sb.removeChannel(subscription);user=null;currentId=null;$('appRoot').style.display='none';$('authGate').style.display='grid';};
$('back').onclick=()=>{main.classList.remove('show');side.classList.remove('hidden');};
$('search').addEventListener('input',e=>{const q=e.target.value.trim().toLocaleLowerCase();document.querySelectorAll('#chatList .chat').forEach(x=>x.style.display=x.dataset.name.toLocaleLowerCase().includes(q)?'flex':'none');});
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;$('authGate').style.display='grid';$('appRoot').style.display='none';}});
(async()=>{try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session){user=data.session.user;await showApp();}else{$('appRoot').style.display='none';}}catch(e){showError('اتصال به سرور برقرار نشد: '+e.message);}})();
window.addEventListener('online',()=>{if(user)setStatus('اینترنت وصل شد؛ در حال همگام‌سازی…');});
window.addEventListener('offline',()=>setStatus('اینترنت قطع است؛ ارسال پیام موقتاً ممکن نیست.'));
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(innerWidth>700)main.classList.add('show');
</script></body></html>
